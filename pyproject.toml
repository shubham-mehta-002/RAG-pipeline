    "openai>=1.30.0",       # embeddings + GPT-4o vision OCR
    "qdrant-client>=1.9.0", # vector store client
    "rank-bm25>=0.2.2",     # BM25 keyword search
    "sentence-transformers>=3.0.0",  # local cross-encoder reranker
]
