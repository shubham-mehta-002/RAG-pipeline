[project]
name = "rag-prod"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-magic>=0.4.27",
    "pymupdf>=1.24.0",      # PDF text + image extraction
    "pytesseract>=0.3.10",  # OCR fallback if GPT-4o call fails
